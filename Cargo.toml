[package]
name = "dedup-wasm"
version = "0.1.0"
edition = "2024"
description = "WASM binding for text deduplication — n-gram, Jaccard, sentence similarity"
license = "MIT"
repository = "https://git.sly.so/kade/stalk"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { git = "https://git.sly.so/kade/serde", package = "serde", features = ["derive"] }
serde_json = { git = "https://git.sly.so/kade/serde_json" }
wasm-bindgen = { git = "https://git.sly.so/kade/wasm-bindgen", package = "wasm-bindgen" }
ahash = { git = "https://git.sly.so/kade/ahash", package = "ahash", version = "0.8" }
memchr = { git = "https://git.sly.so/kade/memchr", package = "memchr", version = "2.7" }
regex = { git = "https://git.sly.so/kade/regex", package = "regex", version = "1.10" }
once_cell = { git = "https://git.sly.so/kade/once_cell", package = "once_cell", version = "1.19" }

[target.wasm32-unknown-unknown.dependencies]
getrandom = { git = "https://git.sly.so/kade/getrandom", features = ["wasm_js"] }

[dev-dependencies]
wasm-bindgen-test = { git = "https://git.sly.so/kade/wasm-bindgen", package = "wasm-bindgen-test", version = "0.3" }

[profile.release]
opt-level = "z"
lto = true
panic = "abort"
codegen-units = 1

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
panic = "abort"
codegen-units = 1