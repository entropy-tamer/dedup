[package]
name = "dedup-wasm"
version = "0.1.0"
edition = "2024"
description = "WASM binding for text deduplication — n-gram, Jaccard, sentence similarity"
license = "MIT"
repository = "https://git.sly.so/kade/dedup"
rust-version = "1.101.0"

[lib]
crate-type = ["cdylib", "rlib"]

[[test]]
name = "dedup_tests"
path = "test/dedup_tests.rs"

[dependencies]
serde = { git = "https://git.sly.so/kade/serde", package = "serde", features = ["derive"] }
serde_json = { git = "https://git.sly.so/kade/serde_json" }
wasm-bindgen = { git = "https://git.sly.so/kade/wasm-bindgen", rev = "c7a9219eaa5e5e344c668f6a952259520c2236dd", package = "wasm-bindgen" }
ahash = { git = "https://git.sly.so/kade/ahash", rev = "e09d24e369c951dfe87c52b203b12bae7d500587", package = "ahash" }
regex = {git = "https://git.sly.so/kade/regex", package = "regex"}
once_cell = {git = "https://git.sly.so/kade/once_cell", package = "once_cell"}

[target.wasm32-unknown-unknown.dependencies]
getrandom = { git = "https://git.sly.so/kade/getrandom", rev = "7a84146786fd0121ade1dd136b1c04bb4f6d2b36", features = ["wasm_js"] }

[dev-dependencies]
wasm-bindgen-test = { git = "https://git.sly.so/kade/wasm-bindgen", rev = "c7a9219eaa5e5e344c668f6a952259520c2236dd", package = "wasm-bindgen-test" }

[profile.release]
opt-level = "z"
lto = true
panic = "abort"
codegen-units = 1

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
panic = "abort"
codegen-units = 1
